<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Administrativo · Rastro e Voz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6F1;--card:#FFFFFF;--card2:#F8FAF7;--ink:#17301F;--muted:#56665A;--line:#DCE3D8;--line2:#EAEFE7;--green:#2C6B3F;--green-d:#1E4A2C;--green-s:#E3EEE3;--ong:#FFFFFF;--amber:#8F5A0E;--amber-s:#F7EBD5;--red:#A33D29;--red-s:#F8E4DF;--blue:#2F5E7A;--blue-s:#E2ECF2;--side:#1E4A2C;--navon-bg:#F3F6F1;--navon-ink:#1E4A2C;--note:#FFF7E3;--shadow:0 16px 44px rgba(20,40,25,.2);color-scheme:light}
:root[data-theme="dark"]{--bg:#121417;--card:#1B1E22;--card2:#22262B;--ink:#ECEFF1;--muted:#A3ABB3;--line:#30353B;--line2:#262A30;--green:#5DB37A;--green-d:#3F8F5A;--green-s:#1F2E25;--ong:#0E1512;--amber:#E6B060;--amber-s:#352B18;--red:#EF8F7A;--red-s:#3A221D;--blue:#86BAD8;--blue-s:#1B2B35;--side:#16191C;--navon-bg:#2A2F35;--navon-ink:#ECEFF1;--note:#302A17;--shadow:0 16px 44px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45}
body{font-feature-settings:"tnum"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.app{display:flex;min-height:100vh}
.side{width:244px;flex-shrink:0;background:var(--side);color:#E3ECE1;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 16px}
.brand b{font-size:15px;display:block}.brand small{font-size:12px;color:#A9C3AC}
.navgrp{font-size:12px;color:#93B097;padding:14px 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#DCE8DA;padding:9px 10px;border-radius:9px;font-weight:600;text-align:left}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:var(--navon-bg);color:var(--navon-ink)}
.nav .bd{margin-left:auto;background:#B7791F;color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;font-weight:700}
.nav .bd.r{background:#C4452F}
.nav.on .bd{background:var(--green);color:var(--ong)}
.me{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:10px;position:relative}
.pop{position:absolute;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:50}
.pop .mi{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:7px;text-align:left}
.pop .mi:hover{background:var(--card2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:30;backdrop-filter:blur(8px)}
.search{flex:1;max-width:540px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);text-align:left}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--muted);background:var(--card2)}
.content{padding:24px 28px 90px;max-width:1360px;width:100%}
h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:800;line-height:1.15}
h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
h3{font-size:14px;margin:0;font-weight:700}
.sub{color:var(--muted);margin:5px 0 0;max-width:75ch}
.muted{color:var(--muted)}.sm{font-size:12px}.b{font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--ong)}
.btn.pri:hover{background:var(--green-d);border-color:var(--green-d)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--card2)}
.btn.dang{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.ic{padding:6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;line-height:1.5}
.t-g{background:var(--green-s);color:var(--green)}.t-a{background:var(--amber-s);color:var(--amber)}.t-r{background:var(--red-s);color:var(--red)}.t-b{background:var(--blue-s);color:var(--blue)}.t-n{background:var(--line2);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:5px;display:inline-block;flex-shrink:0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
tr.sel td{background:var(--green-s)}
.tscroll{overflow-x:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--green)}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip.on{background:var(--green-s);border-color:var(--green);color:var(--green)}
.inp{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;min-width:0}
select.inp{padding-right:28px}
textarea.inp{width:100%;resize:vertical}
.ev{display:flex;gap:3px}
.ev span{width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.ev .y{background:var(--green-s);color:var(--green)}.ev .n{background:var(--line2);color:var(--muted);opacity:.55}
.bar{height:8px;background:var(--line2);border-radius:6px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:var(--green)}
.kpi{padding:16px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;display:block;width:100%}
button.kpi:hover{border-color:var(--muted)}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:5px;align-items:center}
.delta{font-size:12px;display:flex;gap:4px;align-items:center;font-weight:600}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}
.tip{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:8px;border:0;background:transparent;color:var(--muted);padding:0}
.tip .tt{display:none;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);width:240px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;line-height:1.4;padding:8px 10px;border-radius:8px;z-index:60;text-align:left;box-shadow:var(--shadow)}
.tip:hover .tt,.tip:focus .tt{display:block}
.q{position:relative;overflow:hidden;padding:18px 18px 16px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;display:flex;flex-direction:column;gap:6px;width:100%}
.q:hover{border-color:var(--muted)}
.q .qt{font-size:14px;font-weight:700;color:var(--muted)}
.q .qs{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:6px;color:var(--ink)}
.q .qe{font-size:13px;color:var(--muted);line-height:1.35;min-height:35px}
.q .band{position:absolute;left:0;top:0;bottom:0;width:4px}
.q.ok .band{background:var(--green)}.q.warn .band{background:#C98A2B}.q.bad .band{background:var(--red)}
.inbox-item{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line2)}
.inbox-item:last-child{border-bottom:0}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.42);z-index:70;display:flex}
.sheet{margin-left:auto;width:480px;max-width:100%;background:var(--card);height:100%;overflow:auto;padding:22px;box-shadow:var(--shadow);animation:slide .18s ease-out}
.modal{margin:auto;width:520px;max-width:calc(100% - 32px);max-height:88vh;overflow:auto;background:var(--card);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:10px;font-weight:600;z-index:90;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.45);color:var(--bg);border-radius:7px;padding:4px 10px;font-weight:700}
.funnel-row{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;padding:6px 0}
.fb{height:26px;border-radius:6px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:12px;font-weight:700;min-width:28px}
.drop{font-size:12px;color:var(--amber);padding-left:160px;margin:-2px 0;font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line2)}
.chart .axis{fill:var(--muted);font-size:11px}
.chart .val{fill:var(--ink);font-size:11px;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.subnav{position:sticky;top:57px;z-index:20;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
.section{scroll-margin-top:190px;padding-top:26px}
.qtitle{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.qtitle .num{width:32px;height:32px;border-radius:9px;background:var(--green-s);color:var(--green);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.answer{font-size:15px;margin:6px 0 0;max-width:80ch}
.sk{background:linear-gradient(90deg,var(--line2),var(--card2),var(--line2));background-size:200% 100%;animation:sh 1.1s infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.bubble{max-width:78%;padding:10px 12px;border-radius:12px;margin:6px 0}
.bubble.u{background:var(--card2);border:1px solid var(--line)}
.bubble.t{background:var(--green-s);margin-left:auto}
.bubble.n{background:var(--note);border:1px dashed var(--amber);margin-left:auto}
.stepper{display:flex;align-items:center;gap:0}
.stepper i{width:9px;height:9px;border-radius:5px;background:var(--line);display:block}
.stepper i.d{background:var(--green)}
.stepper b{width:10px;height:2px;background:var(--line);display:block}
.stepper b.d{background:var(--green)}
.jour{display:grid;gap:0}
.jour .st{display:flex;gap:10px;align-items:flex-start;position:relative;padding-bottom:14px}
.jour .st:before{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line)}
.jour .st:last-child:before{display:none}
.jour .c{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--line2);color:var(--muted);font-size:11px;font-weight:700;z-index:1}
.jour .st.d .c{background:var(--green);color:var(--ong)}
.jour .st.cur .c{background:var(--amber-s);color:var(--amber);outline:2px solid var(--amber)}
.pal-item{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;width:100%;border:0;background:none;text-align:left}
.pal-item.on{background:var(--green-s)}
.bottom{display:none}
.hide-s{}
details>summary{cursor:pointer;font-weight:600}
.empty{padding:34px 20px;text-align:center}
.srhide{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1180px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:1fr}.hide-m{display:none}}
@media (max-width:980px){.side{width:72px;padding:14px 8px}.side .lbl,.side .navgrp,.brand div,.nav .bd{display:none}.nav{justify-content:center}.content{padding:18px 18px 90px}.top{padding:10px 18px}.g3{grid-template-columns:1fr}}
@media (max-width:680px){.side{display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:40;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 8px;min-width:56px;position:relative}.bottom button.on{color:var(--green)}.g2,.g4,.g5{grid-template-columns:1fr}.hide-s{display:none}.content{padding:16px 14px 90px}h1{font-size:22px}.subnav{top:53px}.sheet{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  const keys=data[0]?data[0].parts.filter(p=>data.some(d=>d.parts.find(x=>x.k===p.k).v)):[];
  return html`<div className="chart"><svg viewBox=${"0 0 "+W+" "+(h+34)} role="img" aria-label=${label}>
    ${a.map(t=>{const y=h-(t/top)*h+10;return html`<g key=${"t"+t}><line x1="36" x2=${W} y1=${y} y2=${y} className="grid"/><text x="28" y=${y+4} textAnchor="end" className="axis">${t}</text></g>`})}
    ${data.map((d,i)=>{let y=h+10;const x=44+i*step+(step-bw)/2;const T=tot(d);const every=data.length>10?2:1;return html`<g key=${i}>${d.parts.map(p=>{if(!p.v)return null;const bh=p.v/top*h;y-=bh;return html`<rect key=${p.k} x=${x} y=${y} width=${bw} height=${bh} fill=${p.color} rx="2"><title>${d.label+" · "+p.k+": "+p.v}</title></rect>`})}${i%every===0?html`<text x=${x+bw/2} y=${h+28} textAnchor="middle" className="axis">${d.label}</text>`:null}${T?html`<text x=${x+bw/2} y=${h+10-T/top*h-5} textAnchor="middle" className="val">${T}</text>`:null}</g>`})}
  </svg>${showLegend!==false&&keys.length>1?html`<div className="legend">${keys.map(p=>html`<span key=${p.k}><span className="dot" style=${{background:p.color}}></span>${p.k}</span>`)}</div>`:null}</div>`;
}
function Line({labels,series,h,label}){
  h=h||170;const W=580;const {top,a}=ticks(Math.max(1,...series.flatMap(s=>s.vals)));const n=labels.length;const X=i=>44+(n===1?0:i*(W-60)/(n-1));const Y=v=>h+10-v/top*h;
  return html`<div className="chart"><svg viewBox=${"0 0 "+W+" "+(h+34)} role="img" aria-label=${label}>
    ${a.map(t=>html`<g key=${"t"+t}><line x1="36" x2=${W} y1=${Y(t)} y2=${Y(t)} className="grid"/><text x="28" y=${Y(t)+4} textAnchor="end" className="axis">${t}</text></g>`)}
    ${labels.map((l,i)=>(n<=13||i%2===0)?html`<text key=${"l"+i} x=${X(i)} y=${h+28} textAnchor="middle" className="axis">${l}</text>`:null)}
    ${series.map(s=>html`<g key=${s.name}><polyline fill="none" stroke=${s.color} strokeWidth="2.5" strokeDasharray=${s.dash||""} points=${s.vals.map((v,i)=>X(i)+","+Y(v)).join(" ")}/>${s.vals.map((v,i)=>html`<circle key=${i} cx=${X(i)} cy=${Y(v)} r="3" fill=${s.color}><title>${s.name+" em "+labels[i]+": "+v}</title></circle>`)}</g>`)}
  </svg><div className="legend">${series.map(s=>html`<span key=${s.name}><span className="dot" style=${{background:s.color}}></span>${s.name}</span>`)}</div></div>`;
}
function HBars({items,color,onPick}){const max=Math.max(1,...items.map(i=>i.v));return html`<div>${items.map((it,i)=>html`<div key=${i} style=${{padding:"7px 0"}}><div className="row between" style=${{marginBottom:5}}><span className="b">${it.label}</span><span className="sm muted">${it.sub||nf(it.v)}</span></div><div className="bar"><i style=${{width:(it.v/max*100)+"%",background:it.color||color||"var(--green)"}}></i>${it.v2!=null?html`<i style=${{width:(it.v2/max*100)+"%",background:"var(--green-d)"}}></i>`:null}</div></div>`)}</div>`}
function Funnel({rows,onPick}){const max=Math.max(1,rows[0][1]);let worst=-1,wv=0;rows.forEach((r,i)=>{if(i>0&&rows[i-1][1]-r[1]>wv){wv=rows[i-1][1]-r[1];worst=i}});
  return html`<div>${rows.map(([l,v],i)=>html`<div key=${l}>${i===worst?html`<div className="drop">Maior perda: ${wv} pessoas</div>`:null}<div className="funnel-row"><span className="sm b">${l}</span><div><div className="fb" style=${{width:Math.max(4,v/max*100)+"%",background:i===worst?"#C98A2B":"var(--green)"}}>${v}</div></div><span className="sm muted">${pct(v,max)}%</span></div></div>`)}</div>`}
function MiniMap({city}){const h=[...city].reduce((a,c)=>a+c.charCodeAt(0),0);const x=60+h%180,y=40+(h*7)%70;return html`<svg viewBox="0 0 300 150" style=${{width:"100%",borderRadius:10,background:"var(--green-s)"}} role="img" aria-label=${"Mapa aproximado de "+city}><path d="M0 110 Q70 80 140 100 T300 90" stroke="var(--line)" strokeWidth="8" fill="none"/><path d="M40 0 Q60 70 30 150" stroke="var(--line)" strokeWidth="5" fill="none"/><circle cx=${x} cy=${y} r="18" fill="var(--green)" opacity=".2"/><circle cx=${x} cy=${y} r="6" fill="var(--green)"/><text x=${x+12} y=${y-10} fontSize="12" fontWeight="700" fill="var(--ink)">${city}</text></svg>`}

function inboxItems(A){
  const it=[];
  const presas=A.devices.filter(d=>d.presa&&!d.ok);
  if(presas.length){const old=Math.min(...presas.map(d=>d.desde));it.push({id:"fila",tone:"r",icon:"wifioff",wait:old,t:presas.length+" celulares com registros presos sem sincronizar",d:presas.reduce((a,d)=>a+d.pend,0)+" registros de campo ainda não chegaram. O mais antigo está preso "+ago(old)+".",a:"Ver filas",go:()=>A.go("saude")})}
  const pr=A.reqs.filter(r=>r.email==="ok");
  if(pr.length){const old=Math.min(...pr.map(r=>r.t));it.push({id:"req",tone:"g",icon:"ucheck",wait:old,t:pr.length+" solicitações prontas para decisão",d:"E-mail confirmado. A mais antiga espera "+ago(old)+".",a:"Analisar",go:()=>A.go("acessos")})}
  const tk=A.tickets.filter(t=>t.st==="Sem resposta");
  if(tk.length){const old=Math.min(...tk.map(t=>t.t));it.push({id:"tk",tone:"b",icon:"buoy",wait:old,t:tk.length===1?"1 chamado sem resposta":tk.length+" chamados sem resposta",d:tk.map(t=>first(U[t.user].nome)+": "+t.assunto).join(". ")+".",a:"Responder",go:()=>A.go("atendimento")})}
  const inv=A.invites.filter(i=>i.st==="enviado");
  if(inv.length){const old=Math.min(...inv.map(i=>i.t));it.push({id:"inv",tone:"a",icon:"mail",wait:old,t:inv.length+" convites enviados e nunca abertos",d:inv.slice(0,2).map(i=>i.nome).join(" e ")+(inv.length>2?" e outros":"")+". Vale lembrar por WhatsApp.",a:"Ver convites",go:()=>A.go("acessos","conv")})}
  const sem=A.M.L.filter(l=>scoreEv(l.ev)===0);
  if(sem.length){const old=Math.min(...sem.map(l=>l.t));it.push({id:"ev",tone:"r",icon:"file",wait:old,t:sem.length+" lotes sem nenhuma evidência",d:"Sem GPS, foto, áudio ou documento, o lote não serve para auditoria. "+[...new Set(sem.map(l=>first(U[l.owner].nome)))].join(", ")+".",a:"Ver lotes",go:()=>A.go("lotes","faltam")})}
  const semLote=users.filter(u=>u.ativ&&u.perfil!=="Comprador(a)"&&u.ativ<TODAY-7*DAY&&!A.M.L.some(l=>l.owner===u.id));
  if(semLote.length)it.push({id:"sl",tone:"a",icon:"users",wait:Math.min(...semLote.map(u=>u.ativ)),t:semLote.length+" usuários ativaram a conta e nunca registraram lote",d:"Ativaram há mais de 7 dias. Um contato agora evita que desistam.",a:"Ver usuários",go:()=>A.go("usuarios","semlote")});
  const order={fila:0,req:1,tk:2,ev:3,inv:4,sl:5};
  return it.sort((a,b)=>order[a.id]-order[b.id]);
}

function RowMenu({items}){
  const [o,setO]=useState(false);const ref=useRef(null);
  useEffect(()=>{if(!o)return;const k=e=>{if(ref.current&&!ref.current.contains(e.target))setO(false)};const esc=e=>{if(e.key==="Escape")setO(false)};document.addEventListener("mousedown",k);document.addEventListener("keydown",esc);return ()=>{document.removeEventListener("mousedown",k);document.removeEventListener("keydown",esc)}},[o]);
  return html`<div ref=${ref} style=${{position:"relative",display:"inline-block"}}><button type="button" className="btn ghost ic" aria-label="Mais ações" aria-expanded=${o} onClick=${()=>setO(!o)}><${Icon} n="more" s=${16}/></button>${o?html`<div className="pop" style=${{right:0,top:"110%",minWidth:190}} role="menu">${items.map(([l,f,d])=>html`<button type="button" role="menuitem" key=${l} className="mi" style=${{color:d?"var(--red)":"inherit"}} onClick=${()=>{setO(false);f()}}>${l}</button>`)}</div>`:null}</div>`;

function Usuarios({arg}){
  const A=useA();
  const init=arg&&arg.startsWith("perfil:")?arg.slice(7):null;
  const [perfil,setPerfil]=useState(init||"Todos");

  const counts=Object.fromEntries(PERFIS.map(p=>[p,users.filter(u=>u.perfil===p).length]));
  const f=rows.filter(({u,my,st})=>{
    if(perfil!=="Todos"&&u.perfil!==perfil)return false;
    if(q&&!norm(u.nome+u.cidade+u.org+(u.codigo||"")).includes(norm(q)))return false;
    const prod=u.perfil!=="Comprador(a)";
    switch(jf){case "naoativou":return u.aprov&&!u.ativ;case "semlote":return prod&&u.ativ&&!my.length;case "semev":return my.some(l=>scoreEv(l.ev)<50);case "qrsem":return my.some(l=>l.qr&&!consLot.has(l.id));case "inat7":return u.ativ&&!activeAt(u,7);case "inat30":return u.ativ&&!activeAt(u,30);case "inat40":return u.ativ&&!activeAt(u,40);default:return true}
  }).sort((a,b)=>(b.u.last||b.u.pedido)-(a.u.last||a.u.pedido));
  const acao=({u,my,st})=>{
    if(!u.aprov)return ["Analisar pedido",()=>A.go("acessos")];

    return ["Ver perfil",()=>A.openUser(u.id)];

      ${JFILTERS.map(([k,l])=>html`<button type="button" key=${k} className=${"chip "+(jf===k?"on":"")} aria-pressed=${jf===k} onClick=${()=>setJf(k)}>${l}</button>`)}
    </div>
    <div className="card tscroll">
      ${f.length?html`<table><thead><tr><th>Nome</th><th>Perfil</th><th className="hide-m">Cidade</th><th>Etapa da jornada</th><th>Último uso</th><th style=${{textAlign:"right"}}>Próximo passo</th></tr></thead><tbody>

    </div>
  </div>`;

      <${DL} rows=${[["Celular",d.modelo],["Versão do app",d.versao],["Registros pendentes",d.pend+" ("+d.tipo+")"],["Presa desde",fDT(d.desde)],["Último contato do celular",ago(d.sync)],["O que fazer",d.acao]]}/>
      <h3 style=${{margin:"16px 0 8px"}}>Tentativas de envio</h3>${d.tent.map((x,i)=>html`<div key=${i} className="row between sm" style=${{padding:"6px 0",borderBottom:"1px solid var(--line2)"}}><span>${x.msg}</span><span className="muted">${fDT(x.t)}</span></div>`)}
      <div className="row wrap" style=${{marginTop:16}}><${Btn} k="pri" icon="msg" onClick=${()=>A.whats(U[d.user],"Olá, "+first(U[d.user].nome)+". Alguns registros do seu celular ainda não chegaram. "+d.msgU+". Seus registros continuam guardados no celular.")}>Avisar por WhatsApp<//><${Btn} onClick=${()=>{A.setDevices(A.devices.map(y=>y.id===d.id?{...y,ok:true}:y));setOpen(null);A.toast("Fila marcada como resolvida")}}>Marcar como resolvido<//></div>
    <//>`:null}
  </div>`;
}

/* ================= Tela: Configurações ================= */
function Config({arg}){
  const A=useA();
  const G=[["Operação",[["catalogo","layers","Catálogo de produtos e cadeias","Produtos, unidades e cadeias disponíveis no cadastro"],["formularios","list","Formulários de cadastro","Etapas e campos extras por cadeia, sem precisar de deploy"],["creditos","ticket","Créditos e vouchers","Saldo de QR Codes e acessos patrocinados"]]],["Técnico",[["auditoria","scroll","Auditoria de ações","Quem fez o quê no painel, em linguagem legível"],["integracoes","key","Integrações e links de passagem","Chaves para sistemas parceiros e links temporários"]]],["Histórico",[["arquivo","archive","Arquivo do marketplace","Vendas e cobranças do fluxo retirado em 27/07/2026"]]]];
  const [fq,setFq]=useState("");const [tec,setTec]=useState({});
  const [auditRows,setAuditRows]=useState(AUDIT);const [auditLoad,setAuditLoad]=useState(false);const [auditOffline,setAuditOffline]=useState(false);
  const [sugs,setSugs]=useState(SUGGESTIONS0);const [sugStatus,setSugStatus]=useState("pending");
  const [sugLoad,setSugLoad]=useState(false);const [sugOffline,setSugOffline]=useState(false);
  const [units,setUnits]=useState(UNITS0);const [unitsOffline,setUnitsOffline]=useState(false);
  const [rejeitar,setRejeitar]=useState(null);
  const [novaUn,setNovaUn]=useState({label:"",category:UNIT_CATS[0]});
  const [chains,setChains]=useState(CHAINS0);const [chainsOffline,setChainsOffline]=useState(false);
  const [subtypeId,setSubtypeId]=useState(CHAINS0[0].subtypes[0].id);
  const [steps,setSteps]=useState(new Set(CHAINS0[0].subtypes[0].form_config.enabled_steps));
  const [formSaving,setFormSaving]=useState(false);
  const [campaigns,setCampaigns]=useState(CAMPAIGNS0);const [campOffline,setCampOffline]=useState(false);
  const [novaCamp,setNovaCamp]=useState({code:"",credits:5,max_redemptions:50,expires_at:"",reason:""});
  const [alvo,setAlvo]=useState("");const [alvoUser,setAlvoUser]=useState(null);const [alvoLoad,setAlvoLoad]=useState(false);
  const [concessao,setConcessao]=useState({credits:5,reason:""});
  const [voucherId,setVoucherId]=useState("");
  const [keys,setKeys]=useState(PARTNER_KEYS0);const [keysOffline,setKeysOffline]=useState(false);
  const [novaChave,setNovaChave]=useState({account_id:"",label:""});
  const [chaveGerada,setChaveGerada]=useState(null);
  const [overview,setOverview]=useState(OVERVIEW0);const [overviewOffline,setOverviewOffline]=useState(false);
  useEffect(()=>{
    if(arg!=="auditoria")return;
    let alive=true;setAuditLoad(true);
    apiGet("/api/mvp_admin.php?action=audit_log&page=1&limit=50").then(res=>{
      if(!alive)return;setAuditLoad(false);
      if(res.ok&&res.data&&res.data.entries){
        setAuditRows(res.data.entries.map(e=>({t:parseDT(e.created_at),quem:(e.admin_jti||"admin").slice(0,8),acao:e.action,alvo:e.target_type+" #"+e.target_id,tec:JSON.stringify({details:e.details,ip_address:e.ip_address,admin_jti:e.admin_jti})})));
        setAuditOffline(false);
      }else{setAuditRows(AUDIT);setAuditOffline(true)}
    });
    return ()=>{alive=false};
  },[arg]);
  useEffect(()=>{
    if(arg!=="catalogo")return;
    let alive=true;setSugLoad(true);
    apiGet("/api/admin_catalog_suggestions.php?action=list&status="+sugStatus).then(res=>{
      if(!alive)return;setSugLoad(false);
      if(res.ok&&res.data&&res.data.suggestions){setSugs(res.data.suggestions);setSugOffline(false)}
      else{setSugs(SUGGESTIONS0.filter(s=>sugStatus==="all"||s.status===sugStatus));setSugOffline(true)}
    });
    apiGet("/api/measurement_units.php").then(res=>{
      if(!alive)return;
      if(res.ok&&res.data&&res.data.units){setUnits(res.data.units);setUnitsOffline(false)}
      else{setUnits(UNITS0);setUnitsOffline(true)}
    });
    return ()=>{alive=false};
  },[arg,sugStatus]);
  useEffect(()=>{
    if(arg!=="formularios")return;
    let alive=true;
    apiGet("/api/admin_chain_subtypes.php?action=list").then(res=>{
      if(!alive)return;
      const cs=res.ok&&res.data&&res.data.chains;
      if(cs&&cs.length){
        setChains(cs);setChainsOffline(false);
        const first=cs[0].subtypes[0];
        setSubtypeId(first.id);setSteps(new Set(first.form_config.enabled_steps||[]));
      }else{setChains(CHAINS0);setChainsOffline(true)}
    });
    return ()=>{alive=false};
  },[arg]);
  useEffect(()=>{
    if(arg!=="creditos")return;
    let alive=true;
    apiGet("/api/qr_credit_promotions.php?action=admin_list").then(res=>{
      if(!alive)return;
      if(res.ok&&res.data&&res.data.campaigns){setCampaigns(res.data.campaigns);setCampOffline(false)}
      else{setCampaigns(CAMPAIGNS0);setCampOffline(true)}
    });
    return ()=>{alive=false};
  },[arg]);
  useEffect(()=>{
    if(arg!=="integracoes")return;
    let alive=true;
    apiGet("/api/admin_partner_keys.php?action=list").then(res=>{
      if(!alive)return;
      if(res.ok&&res.data&&res.data.keys){setKeys(res.data.keys);setKeysOffline(false)}
      else{setKeys(PARTNER_KEYS0);setKeysOffline(true)}
    });
    return ()=>{alive=false};
  },[arg]);
  useEffect(()=>{
    if(arg!=="arquivo")return;
    let alive=true;
    apiGet("/api/mvp_admin.php?action=overview").then(res=>{
      if(!alive)return;
      if(res.ok&&res.data&&res.data.overview){setOverview(res.data.overview);setOverviewOffline(false)}
      else{setOverview(OVERVIEW0);setOverviewOffline(true)}
    });
    return ()=>{alive=false};
  },[arg]);
  const revisar=(sug,decision,note)=>{
    apiPost("/api/admin_catalog_suggestions.php?action=review",{suggestion_id:sug.id,decision,resolution_note:note||undefined}).then(()=>{
      setSugs(prev=>prev.map(s=>s.id===sug.id?{...s,status:decision==="add"?"added":"rejected"}:s).filter(s=>sugStatus==="all"||s.status===sugStatus));
      A.toast(decision==="add"?"Sugestão adicionada ao catálogo":"Sugestão marcada como não incluída");
    });
    setRejeitar(null);
  };
  const cadastrarUnidade=()=>{
    if(!novaUn.label.trim())return;
    apiPost("/api/measurement_units.php",{label:novaUn.label.trim(),category:novaUn.category}).then(res=>{
      const unit=(res.ok&&res.data&&res.data.unit)||{unit_key:norm(novaUn.label).replace(/\s+/g,"_"),label:novaUn.label.trim(),category:novaUn.category};
      setUnits(prev=>[...prev,unit]);
      setNovaUn({label:"",category:UNIT_CATS[0]});
      A.toast((res.ok&&res.data&&res.data.message)||"Unidade cadastrada com sucesso.");
    });
  };
  const toggleStep=n=>setSteps(prev=>{const s=new Set(prev);s.has(n)?s.delete(n):s.add(n);return s});
  const salvarFormulario=()=>{
    setFormSaving(true);
    const subtype=chains.flatMap(c=>c.subtypes).find(s=>s.id===subtypeId);
    const extra_fields=(subtype&&subtype.form_config&&subtype.form_config.extra_fields)||[];
    apiPost("/api/admin_chain_subtypes.php?action=update_form_config",{subtype_id:subtypeId,extra_fields,enabled_steps:[...steps].sort((a,b)=>a-b)}).then(()=>{
      setFormSaving(false);
      A.toast("As mudanças valem para os próximos cadastros.");
    });
  };
  const buscarAlvo=()=>{
    if(!alvo.trim())return;
    setAlvoLoad(true);setAlvoUser(null);
    apiGet("/api/qr_credit_promotions.php?action=admin_lookup_user&target="+encodeURIComponent(alvo.trim())).then(res=>{
      setAlvoLoad(false);
      if(res.ok&&res.data&&res.data.user)setAlvoUser(res.data.user);
      else A.toast("Usuário não encontrado ou API ainda não conectada.");
    });
  };
  const concederCreditos=()=>{
    if(!alvoUser||!concessao.reason.trim())return;
    apiPost("/api/qr_credit_promotions.php?action=admin_grant_direct",{target:alvo.trim(),credits:concessao.credits,reason:concessao.reason.trim(),request_id:newReqId()}).then(res=>{
      const saldo=res.ok&&res.data&&res.data.grant&&res.data.grant.qr_balance!=null?res.data.grant.qr_balance:(alvoUser.qr_balance||0)+concessao.credits;
      setAlvoUser({...alvoUser,qr_balance:saldo});
      setConcessao({credits:5,reason:""});
      A.toast((res.ok&&res.data&&res.data.message)||"Créditos concedidos com sucesso.");
    });
  };
  const criarCampanha=()=>{
    if(!novaCamp.credits||!novaCamp.max_redemptions)return;
    apiPost("/api/qr_credit_promotions.php?action=admin_create_campaign",novaCamp).then(res=>{
      const camp=(res.ok&&res.data&&res.data.campaign)||{id:Date.now(),code:novaCamp.code||"QR-"+Date.now(),credits:novaCamp.credits,max_redemptions:novaCamp.max_redemptions,redeemed_count:0,status:"active",expires_at:novaCamp.expires_at,reason:novaCamp.reason};
      setCampaigns(prev=>[...prev,camp]);
      setNovaCamp({code:"",credits:5,max_redemptions:50,expires_at:"",reason:""});
      A.toast("Campanha criada.");
    });
  };
  const alternarCampanha=camp=>{
    const status=camp.status==="active"?"disabled":"active";
    apiPost("/api/qr_credit_promotions.php?action=admin_campaign_status",{campaign_id:camp.id,status}).then(()=>{
      setCampaigns(prev=>prev.map(c=>c.id===camp.id?{...c,status}:c));
      A.toast(status==="active"?"Campanha ativada.":"Campanha desativada.");
    });
  };
  const enviarVoucher=()=>{
    if(!voucherId.trim())return;
    apiPost("/api/mvp_admin.php?action=email_voucher",{voucher_id:voucherId.trim()}).then(res=>{
      A.toast((res.ok&&res.data&&res.data.message)||"Voucher enviado por email.");
      setVoucherId("");
    });
  };
  const criarChave=()=>{
    if(!novaChave.account_id||!novaChave.label.trim())return;
    apiPost("/api/admin_partner_keys.php?action=create",{account_id:+novaChave.account_id,label:novaChave.label.trim()}).then(res=>{
      if(res.ok&&res.data&&res.data.plaintext_key){
        setChaveGerada(res.data);
        setKeys(prev=>[...prev,{id:Date.now(),account_id:+novaChave.account_id,label:novaChave.label.trim(),key_prefix:res.data.key_prefix,created_at:new Date().toISOString(),last_used_at:null,revoked_at:null,account_name:""}]);
      }else{
        setChaveGerada({message:"API ainda não conectada — mostrando uma chave de exemplo.",plaintext_key:"rv_exemplo_"+Math.random().toString(16).slice(2,10),key_prefix:"rv_"+Math.random().toString(16).slice(2,6)});
      }
      setNovaChave({account_id:"",label:""});
    });
  };
  const revogarChave=key=>{
    apiPost("/api/admin_partner_keys.php?action=revoke",{id:key.id}).then(()=>{
      setKeys(prev=>prev.map(k=>k.id===key.id?{...k,revoked_at:new Date().toISOString()}:k));
      A.toast("Chave revogada.");
    });
  };
  if(!arg)return html`<div><${Head} title="Configurações" sub="Funções que continuam disponíveis, fora da rotina diária."/>${G.map(([g,items])=>html`<div key=${g} style=${{marginTop:22}}><h2 style=${{marginBottom:10}}>${g}</h2><div className="grid" style=${{gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))"}}>${items.map(([k,ic,t,dsc])=>html`<button type="button" key=${k} className="card row" style=${{padding:16,textAlign:"left",alignItems:"flex-start"}} onClick=${()=>A.go("config",k)}><span className="ico t-g"><${Icon} n=${ic} s=${17}/></span><span style=${{flex:1}}><b>${t}</b><span className="sm muted" style=${{display:"block"}}>${dsc}</span></span><${Icon} n="chr" s=${16}/></button>`)}</div></div>`)}</div>`;
  const title=G.flatMap(g=>g[1]).find(x=>x[0]===arg)[2];
  const back=html`<button type="button" className="btn ghost sm" onClick=${()=>A.go("config")}><${Icon} n="chl" s=${14}/>Configurações</button>`;
  let body;
  if(arg==="auditoria"){
    const rows=auditRows.filter(a=>!fq||a.quem===fq);
    const quemOpts=auditOffline?[...TEAM,"Sistema"]:[...new Set(auditRows.map(a=>a.quem))];
    body=html`<div className="card tscroll" style=${{marginTop:14}}>

function WhatsModal({data,onClose}){
  const A=useA();const [msg,setMsg]=useState(data.msg);
  return html`<${Modal} label="Mensagem por WhatsApp" onClose=${onClose}>
    <div className="row between"><h2>WhatsApp para ${first(data.u.nome)}</h2><${CloseBtn} onClick=${onClose}/></div>
    <p className="sm muted">${data.u.nome}, ${data.u.tel}. Linguagem simples funciona melhor. Se preferir, grave um áudio depois de abrir a conversa.</p>
    <label className="srhide" htmlFor="wa-msg">Mensagem</label>
    <textarea id="wa-msg" className="inp" rows="6" value=${msg} onInput=${e=>setMsg(e.target.value)}></textarea>
    <div className="row between wrap" style=${{marginTop:12}}><span className="sm muted">${msg.length} caracteres</span><div className="row"><${Btn} k="ghost" onClick=${onClose}>Cancelar<//><${Btn} k="pri" icon="send" disabled=${!msg.trim()} onClick=${()=>{onClose();A.toast("Mensagem enviada por WhatsApp para "+first(data.u.nome))}}>Enviar mensagem<//></div></div>
  <//>`;
}
